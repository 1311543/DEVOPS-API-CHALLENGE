services:
  mysql:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: Eliam
      MYSQL_DATABASE: 'demo_db'
    ports:
      - "3306:3306"

    healthcheck:
          test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
          interval: 20s
          retries: 5
          start_period: 40s
  api:
    image: francisjosue/api:latest
    environment:
      - FLASK_APP=app.py
    build:
      context: ./
    volumes:
      - ./:/app/
#    command: ["flask", "run", "-h", "0.0.0.0", "-p", "8080"]
    entrypoint: /bin/sh -c "cd src && flask run -h 0.0.0.0 -p 8080"
    command: /bin/sh -c "cd src && sh ./alembic_migrations.sh"
#    command: /bin/sh -c "cd src ./alembic_migrations.sh & wait; cd src && flask run -h 0.0.0.0 -p 8080"
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
